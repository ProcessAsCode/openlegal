# Nginx config for the OpenLegal frontend container.
#
# Apache (upstream) strips /app/ and forwards the rest here, so this server
# only sees requests like /queue, /cases/<id>, /assets/foo.js. SPA fallback
# routes unknown paths back to index.html so client-side routing works.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
