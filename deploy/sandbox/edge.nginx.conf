# Edge for the legal pilot bundle.
#
# resolver + variable upstreams are deliberate: with a literal
# `proxy_pass http://api:8002;` nginx resolves the name ONCE at startup and
# keeps proxying to a dead container IP after any rebuild — every request
# 502s at the edge while the service answers 200 on localhost. The explicit
# $request_uri is equally load-bearing: with a variable in proxy_pass nginx
# passes the normalised URI and DROPS the query string.
server {
  listen 80;
  server_name _;
  client_max_body_size 32m;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream      http://api:8002;
  set $eligumi_upstream  http://eligumi:8050;
  set $frontend_upstream http://frontend:80;

  # Preserve the scheme Apache/Cloudflare saw; nginx's own $scheme is http here.
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_http_version 1.1;
  proxy_read_timeout 300s;

  location /api/    { proxy_pass $api_upstream$request_uri; }
  location /uapf/   { proxy_pass $api_upstream$request_uri; }
  location /docs    { proxy_pass $api_upstream$request_uri; }
  location /openapi.json { proxy_pass $api_upstream$request_uri; }

  # e-Līgumi store: workspace UI and its read API, both under /eligumi/.
  location /eligumi/ {
    rewrite ^/eligumi/(.*)$ /$1 break;
    proxy_pass $eligumi_upstream;
  }

  location / { proxy_pass $frontend_upstream$request_uri; }
}
